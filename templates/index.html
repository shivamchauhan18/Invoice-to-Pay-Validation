<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice-to-Pay Validation</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 40px auto;
        }

        /* ================= HEADER ================= */

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        /* ================= CARD ================= */

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 15px;
        }

        /* ================= UPLOAD ================= */

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px dashed #9ca3af;
            border-radius: 10px;
            background: #f9fafb;
            cursor: pointer;
        }

        /* ================= BUTTON ================= */

        .button-container {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 13px 30px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* ================= PROGRESS ================= */

        .progress-card {
            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.4s ease;
        }

        #progressText {
            margin-top: 12px;
            color: #4b5563;
        }

        /* ================= PIPELINE ================= */

        .pipeline {
            margin-top: 20px;
        }

        .pipeline-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f9fafb;
            color: #6b7280;
            transition: 0.3s;
        }

        .pipeline-item.active {
            background: #eff6ff;
            color: #2563eb;
        }

        .pipeline-item.completed {
            background: #ecfdf5;
            color: #047857;
        }

        .icon {
            font-size: 18px;
            width: 25px;
        }

        /* ================= VALIDATION ================= */

        #validationResult {
            display: none;
            margin-top: 25px;
        }

        .result-status {
            font-size: 28px;
            font-weight: bold;
            margin: 18px 0 20px;
        }

        .MATCH {
            color: #059669;
        }

        .MISMATCH {
            color: #dc2626;
        }

        .REVIEW {
            color: #d97706;
        }

        /* ================= VALIDATION TABLE ================= */

        .validation-table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        .validation-table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 14px;
        }

        .validation-table-wrapper th {
            background: #1f2937;
            color: white;
            padding: 12px;
            text-align: left;
            border: 1px solid #374151;
        }

        .validation-table-wrapper td {
            padding: 11px;
            border: 1px solid #d1d5db;
        }

        .validation-table-wrapper tr:nth-child(even) {
            background: #f9fafb;
        }

        /* ================= RESULT CELL COLORS ================= */

        .validation-table-wrapper td.result-mismatch {
            background: #fee2e2 !important;
            color: #b91c1c;
            font-weight: bold;
        }

        .validation-table-wrapper td.result-match {
            background: #dcfce7 !important;
            color: #15803d;
            font-weight: bold;
        }

        .validation-table-wrapper td.result-review {
            background: #fef3c7 !important;
            color: #b45309;
            font-weight: bold;
        }

        /* ================= ACTION BUTTONS ================= */

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            padding: 12px 22px;
            border-radius: 9px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
        }

        .proceed-btn {
            background: #059669;
            color: white;
        }

        .proceed-btn:hover {
            background: #047857;
        }

        .hold-btn {
            background: #dc2626;
            color: white;
        }

        .hold-btn:hover {
            background: #b91c1c;
        }

        /* ================= ERROR ================= */

        #errorBox {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .upload-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>
            Invoice-to-Pay Validation
        </h1>

        <p>
            Upload an Invoice and Purchase Order
            to validate the documents.
        </p>

    </div>


    <!-- ================= UPLOAD ================= -->

    <div class="upload-grid">

        <div class="card">

            <h3>
                Invoice
            </h3>

            <input
                type="file"
                id="invoice"
                accept=".pdf"
            >

        </div>


        <div class="card">

            <h3>
                Purchase Order
            </h3>

            <input
                type="file"
                id="po"
                accept=".pdf"
            >

        </div>

    </div>


    <!-- ================= VALIDATE BUTTON ================= -->

    <div class="button-container">

        <button
            id="validateButton"
            onclick="validateDocuments()"
        >
            Validate Documents
        </button>

    </div>


    <!-- ================= PROGRESS ================= -->

    <div class="card progress-card">

        <div class="progress-header">

            <strong>
                Processing
            </strong>

            <span id="progressPercent">
                0%
            </span>

        </div>


        <div class="progress-container">

            <div
                id="progress"
                class="progress-bar"
            ></div>

        </div>


        <div id="progressText">

            Waiting for documents...

        </div>


        <!-- Pipeline -->

        <div class="pipeline">

            <div
                class="pipeline-item"
                data-node="extract"
            >

                <span class="icon">
                    ○
                </span>

                <span>
                    Extracting Invoice and PO
                </span>

            </div>


            <div
                class="pipeline-item"
                data-node="invoice_schema"
            >

                <span class="icon">
                    ○
                </span>

                <span>
                    Reading Invoice details
                </span>

            </div>


            <div
                class="pipeline-item"
                data-node="po_schema"
            >

                <span class="icon">
                    ○
                </span>

                <span>
                    Reading Purchase Order details
                </span>

            </div>


            <div
                class="pipeline-item"
                data-node="validation"
            >

                <span class="icon">
                    ○
                </span>

                <span>
                    Comparing Invoice and PO
                </span>

            </div>

        </div>

    </div>


    <!-- ================= ERROR ================= -->

    <div id="errorBox"></div>


    <!-- ================= VALIDATION RESULT ================= -->

    <div
        class="card"
        id="validationResult"
    >

        <h2>
            Validation Result
        </h2>


        <!-- MATCH / MISMATCH / REVIEW -->

        <div
            id="validationStatus"
            class="result-status"
        ></div>


        <!-- HTML TABLE -->

        <div
            id="validationTable"
            class="validation-table-wrapper"
        ></div>


        <!-- ACTION BUTTONS -->

        <div class="action-buttons">

            <button
                class="proceed-btn"
                onclick="proceedToPayment()"
            >
                Proceed to Payment
            </button>


            <button
                class="hold-btn"
                onclick="holdForReview()"
            >
                Hold for Review
            </button>

        </div>

    </div>


</div>


<script>


// ==================================================
// VALIDATE DOCUMENTS
// ==================================================

async function validateDocuments() {

    const invoiceInput =
        document.querySelector("#invoice");

    const poInput =
        document.querySelector("#po");

    const button =
        document.querySelector("#validateButton");

    const invoiceFile =
        invoiceInput.files[0];

    const poFile =
        poInput.files[0];


    if (!invoiceFile || !poFile) {

        alert(
            "Please select both Invoice and Purchase Order."
        );

        return;

    }


    const formData =
        new FormData();


    formData.append(
        "invoice",
        invoiceFile
    );

    formData.append(
        "po",
        poFile
    );


    resetUI();


    button.disabled = true;

    button.textContent =
        "Processing...";


    try {

        const response =
            await fetch(
                "/validate",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                errorText
            );

        }


        /*
         * Read streaming NDJSON response
         */

        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();

        let buffer = "";


        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {
                break;
            }


            buffer += decoder.decode(
                value,
                {
                    stream: true
                }
            );


            const lines =
                buffer.split("\n");


            buffer =
                lines.pop();


            for (const line of lines) {

                if (!line.trim()) {
                    continue;
                }


                try {

                    const data =
                        JSON.parse(line);


                    console.log(
                        "Received:",
                        data
                    );


                    updateUI(data);


                } catch (error) {

                    console.error(
                        "JSON parsing error:",
                        error
                    );

                    console.error(
                        "Invalid JSON:",
                        line
                    );

                }

            }

        }


    } catch (error) {

        console.error(
            "Request error:",
            error
        );


        showError(
            error.message
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "Validate Documents";

    }

}


// ==================================================
// UPDATE UI
// ==================================================

function updateUI(data) {

    console.log(
        "Graph update:",
        data
    );


    // Progress

    if (
        data.progress !== undefined
    ) {

        document.querySelector(
            "#progress"
        ).style.width =
            data.progress + "%";


        document.querySelector(
            "#progressPercent"
        ).textContent =
            data.progress + "%";

    }


    // Current message

    if (data.message) {

        document.querySelector(
            "#progressText"
        ).textContent =
            data.message;

    }


    // Current node

    if (
        data.node
    ) {

        updateNodeStatus(
            data.node
        );

    }


    // Validation result

    if (
        data.validation
    ) {

        showValidation(
            data.validation
        );

    }


    // Complete

    if (
        data.type === "complete"
    ) {

        document.querySelector(
            "#progressText"
        ).textContent =
            data.message ||
            "Validation completed.";

    }


    // Error

    if (
        data.type === "error"
    ) {

        showError(
            data.message
        );

    }

}


// ==================================================
// UPDATE PIPELINE NODE
// ==================================================

function updateNodeStatus(node) {

    const items =
        document.querySelectorAll(
            ".pipeline-item"
        );


    let currentIndex = -1;


    items.forEach(
        (item, index) => {

            if (
                item.dataset.node === node
            ) {

                currentIndex =
                    index;

            }

        }
    );


    if (currentIndex === -1) {
        return;
    }


    items.forEach(
        (item, index) => {

            const icon =
                item.querySelector(
                    ".icon"
                );


            item.classList.remove(
                "active",
                "completed"
            );


            if (
                index < currentIndex
            ) {

                item.classList.add(
                    "completed"
                );


                if (icon) {
                    icon.textContent = "✓";
                }

            }

            else if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );


                if (icon) {
                    icon.textContent = "●";
                }

            }

            else {

                if (icon) {
                    icon.textContent = "○";
                }

            }

        }
    );

}


// ==================================================
// STYLE VALIDATION TABLE
// ==================================================

function styleValidationTable() {

    const table =
        document.querySelector(
            "#validationTable table"
        );


    if (!table) {
        return;
    }


    const cells =
        table.querySelectorAll(
            "td"
        );


    cells.forEach(
        cell => {

            const value =
                cell.textContent
                    .trim()
                    .toUpperCase();


            /*
             * MISMATCH
             */

            if (
                value === "MISMATCH"
            ) {

                cell.classList.add(
                    "result-mismatch"
                );

            }


            /*
             * MATCH
             */

            else if (
                value === "MATCH"
            ) {

                cell.classList.add(
                    "result-match"
                );

            }


            /*
             * REVIEW
             */

            else if (
                value === "REVIEW"
            ) {

                cell.classList.add(
                    "result-review"
                );

            }

        }
    );

}


// ==================================================
// SHOW VALIDATION
// ==================================================

function showValidation(validation) {

    const resultBox =
        document.querySelector(
            "#validationResult"
        );


    const status =
        document.querySelector(
            "#validationStatus"
        );


    const table =
        document.querySelector(
            "#validationTable"
        );


    if (!validation) {
        return;
    }


    resultBox.style.display =
        "block";


    /*
     * MATCH / MISMATCH / REVIEW
     */

    const statusValue =
        validation.status ||
        "REVIEW";


    status.textContent =
        statusValue;


    status.className =
        "result-status " +
        statusValue;


    /*
     * HTML table
     */

    if (
        validation.html_table
    ) {

        table.innerHTML =
            validation.html_table;


        /*
         * Color MATCH / MISMATCH / REVIEW
         */

        styleValidationTable();

    }

    else {

        table.innerHTML =
            "<p>Validation table not received.</p>";

    }

}


// ==================================================
// PROCEED TO PAYMENT
// ==================================================

function proceedToPayment() {

    const status =
        document.querySelector(
            "#validationStatus"
        ).textContent;


    if (
        status !== "MATCH"
    ) {

        alert(
            "Payment cannot be proceeded because the validation status is " +
            status +
            "."
        );

        return;

    }


    alert(
        "Payment process initiated."
    );


    /*
     * Later connect this to Flask:

        fetch("/proceed-payment", {
            method: "POST"
        });

    */

}


// ==================================================
// HOLD FOR REVIEW
// ==================================================

function holdForReview() {

    alert(
        "Invoice has been placed on hold for review."
    );


    /*
     * Later connect this to Flask:

        fetch("/hold-payment", {
            method: "POST"
        });

    */

}


// ==================================================
// SHOW ERROR
// ==================================================

function showError(error) {

    const errorBox =
        document.querySelector(
            "#errorBox"
        );


    errorBox.style.display =
        "block";


    errorBox.textContent =
        "Error: " +
        error;

}


// ==================================================
// RESET UI
// ==================================================

function resetUI() {

    /*
     * Progress
     */

    document.querySelector(
        "#progress"
    ).style.width =
        "0%";


    document.querySelector(
        "#progressPercent"
    ).textContent =
        "0%";


    document.querySelector(
        "#progressText"
    ).textContent =
        "Starting validation...";


    /*
     * Validation result
     */

    document.querySelector(
        "#validationResult"
    ).style.display =
        "none";


    document.querySelector(
        "#validationStatus"
    ).textContent =
        "";


    document.querySelector(
        "#validationTable"
    ).innerHTML =
        "";


    /*
     * Error
     */

    document.querySelector(
        "#errorBox"
    ).style.display =
        "none";


    document.querySelector(
        "#errorBox"
    ).textContent =
        "";


    /*
     * Pipeline
     */

    const items =
        document.querySelectorAll(
            ".pipeline-item"
        );


    items.forEach(
        item => {

            item.classList.remove(
                "completed",
                "active"
            );


            const icon =
                item.querySelector(
                    ".icon"
                );


            if (icon) {

                icon.textContent =
                    "○";

            }

        }
    );

}

</script>

</body>

</html>
